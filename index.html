<style>
  /* Warm bakery look: butter-cream page, blush bands, rounded white cards, cherry-red buttons.
     Order: header, hero (logo + promise), three feature cards, how it works, what's included, sign-up, footer. */
  :root {
    --bg: #FFF7EA; --surface: #FFFFFF; --ink: #2F2A24; --muted: #5E554A;
    --line: #EAD9C2; --blush: #FBE1DA; --butter: #FBEACB;
    --brand: #A81C22; --brand-ink: #FFFFFF;
    --error: #B3261E; --ok: #2E7D4F;
    --font: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
    --display: "Baloo Bhaijaan 2", "IBM Plex Sans Arabic", system-ui, sans-serif;
    --shadow: 0 8px 28px rgba(120,80,40,.08);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.65; }
  a { color: inherit; }
  .wrap { max-width: 1160px; margin: 0 auto; padding-inline: 24px; }
  h1, h2, h3, p { margin: 0; }
  h1, h2 { font-family: var(--display); font-weight: 800; text-wrap: balance; }
  h2 { font-size: clamp(30px, 4vw, 52px); line-height: 1.25; }
  h3 { font-size: 21px; line-height: 1.4; }
  .muted { color: var(--muted); }

  /* header */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 20px; }
  .lang { background: none; border: 0; color: var(--ink); font: inherit; font-weight: 500; padding: 10px 4px; cursor: pointer; }
  .lang:hover, .lang:focus-visible { text-decoration: underline; outline: none; }
  .pill { display: inline-block; text-decoration: none; font-weight: 700; border-radius: 999px; }
  .pill.soft { background: var(--surface); padding: 12px 24px; box-shadow: 0 6px 18px rgba(120,80,40,.12); }
  .pill.main { background: var(--brand); color: var(--brand-ink); font-size: 19px; padding: 16px 36px; box-shadow: 0 10px 24px rgba(168,28,34,.25); }
  .pill:hover { filter: brightness(1.05); }
  .pill:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .under { font-weight: 700; text-decoration: none; border-bottom: 2px solid var(--ink); padding-bottom: 2px; }

  /* hero */
  .hero { display: flex; flex-direction: column; align-items: center; gap: 26px; text-align: center; padding-block: 24px 72px; }
  .hero img.word { width: min(400px, 72%); height: auto; }
  .hero h1 { font-size: clamp(38px, 5.6vw, 76px); line-height: 1.25; }
  .hero p { max-width: 600px; font-size: 20px; color: var(--muted); }
  .cta { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 18px; }
  /* screenshot frame: hidden until a real screenshot is added */
  .frame { width: 100%; max-width: 980px; margin-top: 20px; background: var(--surface); border-radius: 36px; padding: 18px; box-shadow: 0 4px 40px rgba(120,80,40,.12); }
  .frame img { display: block; width: 100%; height: auto; border-radius: 22px; }
  .hero.has-shot { padding-bottom: 0; }
  .hero.has-shot .frame { border-radius: 36px 36px 0 0; padding-bottom: 0; }

  /* bands and cards */
  .band { background: var(--blush); padding-block: 64px; }
  .sec { padding-block: 72px; }
  .row { display: flex; flex-wrap: wrap; gap: 20px; }
  .feat { flex: 1 1 280px; background: var(--surface); border-radius: 28px; padding: 26px; display: flex; gap: 14px; align-items: flex-start; }
  .ck { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--blush); color: var(--brand); display: grid; place-items: center; }
  .feat h3 { margin-bottom: 4px; }
  .center { text-align: center; margin-bottom: 36px; }
  .step { flex: 1 1 280px; background: var(--surface); border-radius: 32px; padding: 30px; box-shadow: var(--shadow); }
  .num { width: 56px; height: 56px; border-radius: 50%; background: var(--butter); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 28px; }
  .step h3 { margin: 16px 0 4px; }
  .inc { background: var(--butter); border-radius: 36px; padding: 48px 32px; margin-bottom: 72px; }
  .inc h2 { font-size: clamp(28px, 3.6vw, 46px); margin-bottom: 28px; }
  .inc ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 16px 32px; font-weight: 500; font-size: 18px; }
  .inc li { flex: 1 1 280px; display: flex; align-items: center; gap: 12px; }
  .inc .ck { background: var(--surface); }

  /* sign-up */
  .signup { display: flex; flex-wrap: wrap; gap: 40px; align-items: center; }
  .signup-text { flex: 1 1 320px; }
  .signup-text h2 { font-size: clamp(32px, 4.4vw, 58px); line-height: 1.2; margin-bottom: 12px; }
  .signup-text p { font-size: 20px; color: var(--muted); max-width: 420px; margin-bottom: 20px; }
  .card { flex: 1 1 380px; background: var(--surface); border-radius: 32px; padding: 30px; box-shadow: 0 12px 36px rgba(120,80,40,.12); }
  @media (max-width: 420px) { .card { padding: 24px 18px; } .inc { padding: 36px 22px; } }
  form { display: grid; gap: 14px; }
  .field label { display: block; font-weight: 500; font-size: 15px; margin-bottom: 6px; }
  .field input, .field select { width: 100%; min-height: 50px; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; outline: none; transition: border-color .15s, box-shadow .15s; }
  .field select { cursor: pointer; }
  .field select:invalid { color: var(--muted); }
  .field input::placeholder { color: var(--muted); }
  .field input:focus, .field select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--blush); }
  .field.bad input, .field.bad select { border-color: var(--error); }
  .field .err { display: none; color: var(--error); font-size: 13px; margin-top: 4px; }
  .field.bad .err { display: block; }
  input[type=tel] { direction: ltr; }
  [dir=rtl] input[type=tel] { text-align: right; }
  button.go { margin-top: 6px; background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 999px; padding: 16px; font: inherit; font-weight: 700; font-size: 19px; cursor: pointer; }
  button.go:hover { filter: brightness(1.06); }
  button.go:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  button.go:disabled { opacity: .6; cursor: default; }
  .fine { color: var(--muted); font-size: 14px; text-align: center; }
  .fail { color: var(--error); font-size: 14px; text-align: center; }
  .hp { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; opacity: 0; pointer-events: none; }
  .done { text-align: center; padding: 30px 0; }
  .done .tick { width: 56px; height: 56px; border-radius: 50%; background: var(--blush); color: var(--ok); display: grid; place-items: center; margin: 0 auto 14px; }
  .done h2 { font-size: 30px; }
  .done p { color: var(--muted); margin-top: 6px; }

  footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 36px 96px; color: var(--muted); font-size: 14px; }
  footer img { height: 44px; width: auto; display: block; }

  /* WhatsApp contact: floating button, bottom corner on the reading-end side */
  .wa { position: fixed; bottom: 20px; inset-inline-end: 20px; z-index: 50; width: 58px; height: 58px; border-radius: 50%;
    display: grid; place-items: center; background: #1FA855; color: #fff;
    box-shadow: 0 8px 24px rgba(31,168,85,.35); transition: transform .15s, filter .15s; }
  .wa:hover { filter: brightness(1.06); transform: translateY(-2px); }
  .wa:focus-visible { outline: 3px solid #fff; box-shadow: 0 0 0 6px #1FA855; }
  @media (max-width: 420px) { .wa { bottom: 14px; inset-inline-end: 14px; width: 54px; height: 54px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<header class="wrap top">
  <button class="lang" id="langBtn" type="button">English</button>
  <a class="pill soft" href="#signup" data-t="cta"></a>
</header>

<main>

    <div class="frame" hidden><img src="" alt="" data-alt="alt2"></div>
  </section>

  <section class="band">
    <div class="wrap row">
      <div class="feat"><span class="ck"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><div><h3 data-t="s1t"></h3><p class="muted" data-t="s1d"></p></div></div>
      <div class="feat"><span class="ck"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><div><h3 data-t="s2t"></h3><p class="muted" data-t="s2d"></p></div></div>
      <div class="feat"><span class="ck"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><div><h3 data-t="s3t"></h3><p class="muted" data-t="s3d"></p></div></div>
    </div>
  </section>

  <section class="wrap sec">
    <h2 class="center" data-t="howTitle"></h2>
    <div class="row">
      <div class="step"><div class="num" data-t="n1"></div><h3 data-t="h1t"></h3><p class="muted" data-t="h1d"></p></div>
      <div class="step"><div class="num" data-t="n2"></div><h3 data-t="h2t"></h3><p class="muted" data-t="h2d"></p></div>
      <div class="step"><div class="num" data-t="n3"></div><h3 data-t="h3t"></h3><p class="muted" data-t="h3d"></p></div>
    </div>
  </section>

  <div class="wrap">

        <li><span class="ck"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><span data-t="i2"></span></li>
        <li><span class="ck"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><span data-t="i3"></span></li>
        <li><span class="ck"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><span data-t="i4"></span></li>
        <li><span class="ck"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><span data-t="i5"></span></li>
        <li><span class="ck"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><span data-t="i6"></span></li>

  </div>

  <section class="band" id="signup">

            <div class="field">
              <label for="city" data-t="city"></label>
              <select id="city" name="city" required>

                <option value="riyadh" data-t="riyadh"></option>
                <option value="jeddah" data-t="jeddah"></option>
                <option value="makkah" data-t="makkah"></option>
                <option value="madinah" data-t="madinah"></option>

                <option value="" data-t="pick"></option>
                <option value="home" data-t="t_home"></option>
                <option value="shop" data-t="t_shop"></option>
                <option value="branches" data-t="t_branches"></option>
                <option value="cafe" data-t="t_cafe"></option>
                <option value="other" data-t="t_other"></option>
              </select>
              <div class="err" data-t="req"></div>
            </div>
            <div class="field">
              <label for="volume" data-t="volume"></label>
              <select id="volume" name="volume" required>
                <option value="" data-t="pick"></option>
                <option value="lt20" data-t="v1"></option>
                <option value="20-50" data-t="v2"></option>
                <option value="50-150" data-t="v3"></option>

              <div class="err" data-t="req"></div>
            </div>

                <option value="" data-t="pick"></option>
                <option value="organise" data-t="h_1"></option>
                <option value="ordering-page" data-t="h_2"></option>
                <option value="payments" data-t="h_3"></option>
                <option value="baking-plan" data-t="h_4"></option>
                <option value="customer-updates" data-t="h_5"></option>
                <option value="other" data-t="h_6"></option>
              </select>
              <div class="err" data-t="req"></div>
            </div>
            <div class="hp" aria-hidden="true"><input id="website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
            <button class="go" id="go" type="submit" data-t="send"></button>
            <p class="fail" id="fail" hidden></p>
            <p class="fine" data-t="fine"></p>
          </form>
        </div>
        <div class="done" id="doneView" hidden>
          <div class="tick" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
          <h2 data-t="okTitle"></h2>
          <p data-t="okText"></p>
        </div>
      </div>
    </div>
  </section>
</main>

<a class="wa" id="waBtn" href="#" target="_blank" rel="noopener"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 20.5l1.3-4.2A8.5 8.5 0 1 1 8 19.4z"/><path d="M9 8.6c.2-.5.5-.6.8-.6h.5l.9 2-.6.8c.4.9 1.2 1.7 2.1 2.1l.8-.6 2 .9v.5c0 .3-.1.6-.6.8-.9.4-2.5.1-4-1.4S8.6 9.5 9 8.6z" fill="currentColor" stroke-width="1"/></svg></a>

let lang = "ar";
try { const s = localStorage.getItem("cbb_lang"); if (s === "ar" || s === "en") lang = s; } catch (e) {}

function applyLang() {
  const d = T[lang], root = document.documentElement;
  root.lang = lang;
  root.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = d[el.dataset.t] ?? "");
  document.querySelectorAll("[data-alt]").forEach(el => el.alt = d[el.dataset.alt]);
  document.getElementById("langBtn").textContent = d.lang;
  const wa = "https://wa.me/" + CONFIG.WHATSAPP + "?text=" + encodeURIComponent(d.waMsg);
  document.getElementById("waBtn").href = wa;
  document.getElementById("waBtn").setAttribute("aria-label", d.waBtn);
  document.getElementById("waBtn").title = d.waBtn;
  document.getElementById("waAlt").href = wa;
  document.getElementById("waHero").href = wa;
}
document.getElementById("langBtn").onclick = () => {
  lang = lang === "ar" ? "en" : "ar";
  try { localStorage.setItem("cbb_lang", lang); } catch (e) {}
  applyLang();
  syncPlace();
};

/* Phone -> international format.
   Saudi mobiles in any form (05…, 5…, 966…, +966…, 00966…) -> +9665XXXXXXXX.
   Other countries: must start with + or 00 and the country code, 8–15 digits -> +XXXXXXXX.
   Arabic/Persian digits, spaces, dashes and brackets are accepted. */
function phoneOk(raw) {
  let s = String(raw).replace(/[٠-٩]/g, c => "٠١٢٣٤٥٦٧٨٩".indexOf(c)).replace(/[۰-۹]/g, c => "۰۱۲۳۴۵۶۷۸۹".indexOf(c))
    .replace(/[\s\-().\u200e\u200f]/g, "");
  const intl = /^(\+|00)/.test(s);
  s = s.replace(/^\+/, "").replace(/^00/, "");
  if (!/^\d+$/.test(s)) return null;
  let sa = s;
  if (sa.startsWith("966")) sa = sa.slice(3);
  else if (intl) sa = "";               // another country's code
  if (sa.startsWith("0")) sa = sa.slice(1);
  if (/^5\d{8}$/.test(sa)) return "+966" + sa;
  if (intl && /^[1-9]\d{7,14}$/.test(s)) return "+" + s;
  return null;
}

const f = document.getElementById("f");
f.addEventListener("input", e => e.target.closest(".field")?.classList.remove("bad"));
f.addEventListener("change", e => e.target.closest(".field")?.classList.remove("bad"));

/* "Another city" / "Outside Saudi Arabia" -> ask for the city (and country) */
const placeField = document.getElementById("placeField");
function syncPlace() {
  const v = f.city.value, show = v === "other" || v === "abroad";
  placeField.hidden = !show;
  if (!show) { f.place.value = ""; placeField.classList.remove("bad"); }
  f.place.placeholder = T[lang][v === "abroad" ? "placeAbroad" : "placeKsa"];
}
f.city.addEventListener("change", syncPlace);
f.addEventListener("submit", async e => {
  e.preventDefault();
  if (f.website.value) return;
  const checks = [[f.bakery, f.bakery.value.trim()], [f.name, f.name.value.trim()], [f.phone, phoneOk(f.phone.value)], [f.city, f.city.value], [f.place, placeField.hidden || f.place.value.trim()], [f.type, f.type.value], [f.volume, f.volume.value], [f.help, f.help.value]];
  let first = null;
  checks.forEach(([el, ok]) => { el.closest(".field").classList.toggle("bad", !ok); if (!ok && !first) first = el; });
  if (first) { first.focus(); return; }
  // Readable Arabic labels (same in both languages) so the email/dashboard is easy to scan
  const label = sel => T.ar[sel.selectedOptions[0].dataset.t] || sel.value;
  const bakery = f.bakery.value.trim();
  const data = {
    "المخبز": bakery,
    "الاسم": f.name.value.trim(),
    "الجوال": phoneOk(f.phone.value),
    "المدينة": label(f.city) + (placeField.hidden ? "" : " — " + f.place.value.trim()),
    "نوع المشروع": label(f.type),
    "طلبات بالأسبوع": label(f.volume),
    "يحتاج مساعدة في": label(f.help),
    "اللغة": lang === "en" ? "English" : "عربي",
    _subject: "تسجيل جديد في Bakeboard: " + bakery,
    _gotcha: f.website.value   // Formspree's bot trap: filled = dropped as spam
  };
  const go = document.getElementById("go"), fail = document.getElementById("fail");
  go.disabled = true; go.textContent = T[lang].sending; fail.hidden = true;
  try {
    if (CONFIG.SUBMIT_URL) {
      // Accept: application/json makes Formspree reply with JSON instead of redirecting to its thank-you page
      const r = await fetch(CONFIG.SUBMIT_URL, { method: "POST", body: new URLSearchParams(data),
        headers: { Accept: "application/json" } });
      if (!r.ok) throw new Error("HTTP " + r.status);
    } else {
      console.log("[Bakeboard] sign-up (not connected yet):", data);
    }
    document.getElementById("formView").hidden = true;
    document.getElementById("doneView").hidden = false;
  } catch (err) {
    fail.textContent = T[lang].sendFail; fail.hidden = false;
    go.disabled = false; go.textContent = T[lang].send;
  }
});

document.getElementById("yr").textContent = new Date().getFullYear();
applyLang();
